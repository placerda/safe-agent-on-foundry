agent_control_specification_version: "0.4.0-alpha.1"
metadata:
  name: helpdeskbot
  description: SAFE enforcement for scope, evidence, flow, and escalation.
policies:
  lifecycle:
    type: test
    verdict: {decision: allow}
  helpdesk:
    type: rego
    bundle: .
    query: data.helpdeskbot.verdict
intervention_points:
  agent_startup:
    policy_target: "$.target"
    policy: {id: lifecycle}
  input:
    policy_target: "$.target"
    policy: {id: lifecycle}
  pre_model_call:
    policy_target: "$.target"
    policy: {id: lifecycle}
  post_model_call:
    policy_target: "$.target"
    policy: {id: lifecycle}
  agent_shutdown:
    policy_target: "$.target"
    policy: {id: lifecycle}
  pre_tool_call:
    policy_target: "$.tool_call.args"
    policy_target_kind: tool_args
    tool_name_from: "$.tool_call.name"
    policy:
      id: helpdesk
  post_tool_call:
    policy_target: "$.target"
    policy_target_kind: tool_result
    tool_name_from: "$.tool_call.name"
    policy:
      id: helpdesk
      query: data.helpdeskbot.post_tool_verdict
  output:
    policy_target: "$.output"
    policy_target_kind: output
    policy:
      id: helpdesk
      query: data.helpdeskbot.output_verdict
tools:
  get_system_status:
    type: Tool
    id: get_system_status
    clearance: diagnostic
  get_user_account:
    type: Tool
    id: get_user_account
    clearance: diagnostic
  search_kb:
    type: Tool
    id: search_kb
    clearance: diagnostic
  create_escalation_ticket:
    type: Tool
    id: create_escalation_ticket
    clearance: consequential
